[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keytrace"
version = "0.1.0"
description = "Educational keystroke telemetry & behavioral analytics framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT-Educational" }
authors = [{ name = "KeyTrace Educational Project" }]
keywords = ["security", "education", "keylogger", "biometrics", "detection-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pynput>=1.7.6",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
mac = ["pyobjc-framework-Quartz>=10.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
keytrace = "keytrace.cli:main"

[project.urls]
Homepage = "https://github.com/<you>/keytrace"
Documentation = "https://github.com/<you>/keytrace/blob/main/docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
include = ["keytrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
